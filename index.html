<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Mash</title>
    <meta name="description" content="Dino Mash: answer dinosaur questions, earn dino parts, and mash up your own dinosaur!" />
    <!-- Icons: SVG favicon (a three-toed dino track) for browser tabs, PNGs for bookmarks and home screens. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f8f35'/%3E%3Cg fill='%23fff3d6' stroke='%23fff3d6' stroke-width='4' stroke-linejoin='round'%3E%3Cpath d='M25.5 42 L32 9 L38.5 42 Z'/%3E%3Cpath d='M24 47 L10 21 L32 38 Z'/%3E%3Cpath d='M40 47 L54 21 L32 38 Z'/%3E%3Cellipse cx='32' cy='46' rx='10' ry='10'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Dino Mash" />
    <meta name="theme-color" content="#bfdca6" />
    <style>
      html, body { margin: 0; padding: 0; background: #bfdca6; font-family: "Trebuchet MS", Verdana, sans-serif; }
      #game { width: 100%; max-width: 1100px; margin: 0 auto; }
      #save-area { text-align: center; padding: 16px 16px 40px; color: #23401a; }
      #save-area p { font-size: 20px; margin: 8px 0 12px; }
      #finalDino { max-width: min(600px, 100%); border: 4px solid #23401a; border-radius: 16px; background: #fff; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- The finished dino appears here as a normal image so it can be saved
         with right-click > Save image (or press-and-hold on a tablet). -->
    <div id="save-area" hidden>
      <p>Want to keep your dino? Right-click it and choose <b>Save image</b> (or press and hold on a tablet).</p>
      <img id="finalDino" alt="Your finished dinosaur" />
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
